# The oss branch: upstream Libredesk plus our changes (OSS.md).
# Every push and pull request runs the tests. A tag "oss/<version>" (for
# example oss/2.9.2-oss1) also builds ghcr.io/<owner>/libredesk:<version>.
# Tags don't start with "v", so upstream's release workflow never fires.
name: oss image

on:
  push:
    branches: [oss]
    tags: ["oss/*"]
  pull_request:
    branches: [oss]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
      - name: Go tests
        run: go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Frontend tests
        env:
          CYPRESS_INSTALL_BINARY: "0"
        run: |
          corepack enable
          cd frontend
          pnpm install --frozen-lockfile
          pnpm test:run

  image:
    if: startsWith(github.ref, 'refs/tags/oss/')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Version from tag
        id: v
        run: |
          version="${GITHUB_REF_NAME#oss/}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/libredesk:$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.oss
          platforms: linux/amd64
          push: true
          tags: ${{ steps.v.outputs.image }}
          build-args: |
            VERSION=v${{ steps.v.outputs.version }}
            COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Libredesk with help articles per page (branch oss)
            org.opencontainers.image.licenses=AGPL-3.0
