# The oss branch: upstream Libredesk plus our changes (OSS.md).
# Every push and pull request runs the tests. A tag "oss/<version>" (for
# example oss/2.9.2-oss1) also builds ghcr.io/<owner>/libredesk:<version>.
# Tags don't start with "v", so upstream's release workflow never fires.
name: oss image

on:
  push:
    branches: [oss]
    tags: ["oss/*"]
  pull_request:
    branches: [oss]

permissions:
  contents: read

jobs:
  # Checks only what this fork adds on top of upstream (added lines and our
  # commit messages) against a private list in the OSS_DENY_LIST secret.
  # Reports file:line only. Skipped when the secret isn't available.
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Our changes name nothing private
        env:
          DENY: ${{ secrets.OSS_DENY_LIST }}
          ACCEPT: ${{ secrets.OSS_DENY_ACCEPT }}
        run: |
          if [ -z "$DENY" ]; then
            echo "::notice::OSS_DENY_LIST isn't available here: check skipped"; exit 0
          fi
          git fetch -q --no-tags https://github.com/abhinavxd/libredesk.git "+refs/tags/v*:refs/tags/v*"
          base=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD)
          t="$RUNNER_TEMP"
          printf '%s\n' "$DENY" | grep -vE '^\s*(#|$)' > "$t/deny"
          printf '%s\n' "$ACCEPT" | grep -vE '^\s*(#|$)' > "$t/accept" || true
          git diff --no-color -U0 "$base" HEAD \
            | awk '/^\+\+\+ b\//{f=substr($0,7)} /^@@/{split($3,a,/[+,]/); n=a[2]-1} /^\+[^+]/{n++; print f":"n": "substr($0,2)}' > "$t/added"
          git diff --name-only --diff-filter=ACR "$base" HEAD | sed 's/$/:1: (file name)/' >> "$t/added"
          git log --format='%h%n%B' "$base"..HEAD | awk 'NF==1 && /^[0-9a-f]{7,}$/{c=$0; next} !/^Co-Authored-By:/{print "commit "c":0: "$0}' >> "$t/added"
          : > "$t/hits"
          while IFS= read -r p; do
            P="$p" perl -ne 'print if /$ENV{P}/' "$t/added" >> "$t/hits"
          done < "$t/deny"
          if [ -s "$t/accept" ]; then grep -vF -f "$t/accept" "$t/hits" > "$t/left" || true; else cp "$t/hits" "$t/left"; fi
          if [ -s "$t/left" ]; then
            cut -d: -f1,2 "$t/left" | sort -u | while IFS=: read -r f l; do
              echo "::error file=$f,line=$l::names or points to something private (ask a maintainer which rule)"
            done
            exit 1
          fi
          echo "checked $(wc -l < "$t/added") added lines since $base"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
      - name: Go tests
        run: go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Frontend tests
        env:
          CYPRESS_INSTALL_BINARY: "0"
        run: |
          corepack enable
          cd frontend
          pnpm install --frozen-lockfile
          pnpm test:run

  image:
    if: startsWith(github.ref, 'refs/tags/oss/')
    needs: [privacy, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Version from tag
        id: v
        run: |
          version="${GITHUB_REF_NAME#oss/}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/libredesk:$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.oss
          platforms: linux/amd64
          push: true
          tags: ${{ steps.v.outputs.image }}
          build-args: |
            VERSION=v${{ steps.v.outputs.version }}
            COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Libredesk with help articles per page (branch oss)
            org.opencontainers.image.licenses=AGPL-3.0
